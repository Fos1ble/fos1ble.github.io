<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f7fa">
  <title>Транспортний квиток</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #f0f2f5;
    }

    body {
      background-image: url('background.jpg');
      background-size: 100% auto;
      background-position: center top;
      background-repeat: no-repeat;
      position: relative;
    }

    /* =========================================
       ЗДЕСЬ МЕНЯЙ ДАННЫЕ
    ========================================= */
    :root {
      --ticket-number: "AAF142608";
      --price: "10";
      --date: "14.10.2026 12.09";
      --board-number: "3008";
      --code: "TR02425";
    }

    .ticket-number::after { content: var(--ticket-number); }
    .price::after { content: var(--price); }
    .date::after { content: var(--date); }
    .board-number::after { content: var(--board-number); }
    .code::after { content: var(--code); }

    .field {
      position: absolute;
      color: #1c1c1e;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    /* =========================================
       ЗДЕСЬ ДВИГАЙ ВСЕ ТЕКСТЫ
       Меняй только top и left (или right)
    ========================================= */

    /* Шапка */
    .header-left {
      top: 5.5%;
      left: 5.3%;
      font-size: 17px;
      font-weight: 600;
      color: #1a4bb8;
    }

    .header-right {
      top: 5.8%;
      right: 14%;
      font-size: 15px;
      font-weight: 500;
      color: #1a4bb8;
    }

    /* Заголовок "Транспортний квиток" */
    .card-title {
      top: 14.8%;
      left: 22%;
      font-size: 17px;
      font-weight: 500;
      color: #1c1c1e;
    }

    /* Номер квитка */
    .label-ticket {
      top: 26.8%;
      left: 12.8%;
      color: #8e8e93;
      font-size: 13px;
    }
    .value-ticket {
      top: 26.8%;
      left: 42%;
      font-size: 15px;
      font-weight: 500;
      color: #2c2c2e;
    }

    /* Вартість */
    .label-price {
      top: 33.2%;
      left: 12.8%;
      color: #8e8e93;
      font-size: 13px;
    }
    .value-price {
      top: 33.2%;
      left: 42%;
      font-size: 15px;
      font-weight: 500;
      color: #2c2c2e;
    }

    /* Дата */
    .label-date {
      top: 36.6%;
      left: 12.8%;
      color: #8e8e93;
      font-size: 13px;
    }
    .value-date {
      top: 36.6%;
      left: 42%;
      font-size: 15px;
      font-weight: 500;
      color: #2c2c2e;
    }

    /* Бортовий номер */
    .label-board {
      top: 53.8%;
      left: 12.8%;
      color: #8e8e93;
      font-size: 13px;
    }
    .value-board {
      top: 53.8%;
      left: 42%;
      font-size: 15px;
      font-weight: 500;
      color: #2c2c2e;
    }

    /* Код */
    .label-code {
      top: 58.3%;
      left: 12.8%;
      color: #8e8e93;
      font-size: 13px;
    }
    .value-code {
      top: 58.3%;
      left: 42%;
      font-size: 15px;
      font-weight: 500;
      color: #2c2c2e;
    }

    /* Таймер (и невидимая кнопка) */
    .timer-label {
      top: 75.8%;
      left: 0;
      width: 100%;
      text-align: center;
      color: #6c6c70;
      font-size: 13px;
      font-weight: 500;
    }

    .timer-value {
      top: 80.3%;
      left: 0;
      width: 100%;
      text-align: center;
      color: #1a4bb8;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 0.3px;
      z-index: 5;
    }

    /* Невидимая кнопка поверх таймера */
    .timer-button {
      position: absolute;
      top: 72%;
      left: 20%;
      width: 60%;
      height: 9%;
      background: transparent;
      border: none;
      z-index: 10;
      cursor: pointer;
    }

    /* Нижние подписи */
    .nav-home {
      bottom: 4%;
      left: 14.%;
      font-size: 10px;
      color: #1c1c1e;
      font-weight: 500;
    }

    .nav-services {
      bottom: 4%;
      left: 44%;
      font-size: 10.5px;
      color: #1c1c1e;
      font-weight: 600;
    }

    .nav-docs {
      bottom: 4%;
      left: 72.3%;
      font-size: 10px;
      color: #1a4bb8;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <div class="field header-left">Документи</div>
  <div class="field header-right">Акаунт</div>

  <!-- Заголовок -->
  <div class="field card-title">Транспортний квиток</div>

  <!-- Поля -->
  <div class="field label-ticket">Номер квитка:</div>
  <div class="field value-ticket ticket-number"></div>

  <div class="field label-price">Вартість:</div>
  <div class="field value-price price"></div>

  <div class="field label-date">Дата придбання:</div>
  <div class="field value-date date"></div>

  <div class="field label-board">Бортовий номер:</div>
  <div class="field value-board board-number"></div>

  <div class="field label-code">Код:</div>
  <div class="field value-code code"></div>

  <!-- Таймер -->
  <div class="field timer-label">ДІЙСНИЙ ЩЕ:</div>
  <div class="field timer-value" id="timer">00:59:45</div>

  <!-- Невидимая кнопка на таймере -->
  <button class="timer-button" onclick="resetTimer()"></button>

  <!-- Нижние подписи -->
  <div class="field nav-home">Головна</div>
  <div class="field nav-services">Сервіси</div>
  <div class="field nav-docs">Документи</div>

  <script>
    let totalSeconds = 59 * 60 + 45; // 00:59:45
    let timerInterval = null;

    function updateTimerDisplay() {
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      const display = 
        String(hours).padStart(2, '0') + ':' +
        String(minutes).padStart(2, '0') + ':' +
        String(seconds).padStart(2, '0');

      document.getElementById('timer').textContent = display;
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);

      timerInterval = setInterval(() => {
        if (totalSeconds <= 0) {
          clearInterval(timerInterval);
          return;
        }
        totalSeconds--;
        updateTimerDisplay();
      }, 1000);
    }

    function resetTimer() {
      totalSeconds = 59 * 60 + 59; // сброс на 00:59:59
      updateTimerDisplay();
      startTimer();
    }

    // Запускаем при загрузке
    updateTimerDisplay();
    startTimer();
  </script>

</body>
</html>
