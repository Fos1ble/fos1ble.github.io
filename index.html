<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f7fa">
  <title>Транспортний квиток</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #f0f2f5;
    }

    body {
      background-image: url('background.jpg');
      background-size: 100% auto;
      background-position: center top;
      background-repeat: no-repeat;
      position: relative;
    }

    /* === Данные (меняй здесь) === */
    :root {
      --ticket-number: "AAF142608";
      --price: "12";
      --date: "14.10.2026 12.09";
      --board-number: "3008";
      --code: "TR02425";
      --timer: "00:59:45";
    }

    .ticket-number::after { content: var(--ticket-number); }
    .price::after { content: var(--price); }
    .date::after { content: var(--date); }
    .board-number::after { content: var(--board-number); }
    .code::after { content: var(--code); }
    .timer::after { content: var(--timer); }

    .field {
      position: absolute;
      color: #1c1c1e;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: -0.2px;
    }

    /* ===== ШАПКА ===== */
    .header-left {
      top: 5.5%;
      left: 5.3%;
      font-size: 17px;
      font-weight: 600;
      color: #1a4bb8;
    }

    .header-right {
      top: 5.8%;
      right: 14%;
      font-size: 15px;
      font-weight: 500;
      color: #1a4bb8;
    }

    /* Заголовок карточки */
    .card-title {
      top: 14.8%;
      left: 18%;
      font-size: 17px;
      font-weight: 600;
      color: #1c1c1e;
    }

    /* ===== БЛОК 1 ===== */
    .label-ticket {
      top: 24.8%;
      left: 12.8%;
      color: #8e8e93;
      font-size: 13px;
      font-weight: 400;
    }
    .value-ticket {
      top: 24.8%;
      left: 42%;
      font-size: 15px;
      font-weight: 500;
      color: #2c2c2e;
    }

    .label-price {
      top: 29.2%;
      left: 12.8%;
      color: #8e8e93;
      font-size: 13px;
      font-weight: 400;
    }
    .value-price {
      top: 29.2%;
      left: 42%;
      font-size: 15px;
      font-weight: 500;
      color: #2c2c2e;
    }

    .label-date {
      top: 33.6%;
      left: 12.8%;
      color: #8e8e93;
      font-size: 13px;
      font-weight: 400;
    }
    .value-date {
      top: 33.6%;
      left: 42%;
      font-size: 15px;
      font-weight: 500;
      color: #2c2c2e;
    }

    /* ===== БЛОК 2 ===== */
    .label-board {
      top: 43.8%;
      left: 12.8%;
      color: #8e8e93;
      font-size: 13px;
      font-weight: 400;
    }
    .value-board {
      top: 43.8%;
      left: 42%;
      font-size: 15px;
      font-weight: 500;
      color: #2c2c2e;
    }

    .label-code {
      top: 48.3%;
      left: 12.8%;
      color: #8e8e93;
      font-size: 13px;
      font-weight: 400;
    }
    .value-code {
      top: 48.3%;
      left: 42%;
      font-size: 15px;
      font-weight: 500;
      color: #2c2c2e;
    }

    /* ===== ТАЙМЕР ===== */
    .timer-label {
      top: 60.8%;
      left: 0;
      width: 100%;
      text-align: center;
      color: #6c6c70;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .timer-value {
      top: 65.3%;
      left: 0;
      width: 100%;
      text-align: center;
      color: #1a4bb8;
      font-size: 32px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    /* ===== НИЖНИЕ ПОДПИСИ ===== */
    .nav-home {
      bottom: 3.5%;
      left: 15.3%;
      font-size: 10px;
      color: #1c1c1e;
      font-weight: 500;
    }

    .nav-services {
      bottom: 3.5%;
      left: 43.8%;
      font-size: 10.5px;
      color: #1c1c1e;
      font-weight: 500;
    }

    .nav-docs {
      bottom: 3.5%;
      left: 71.3%;
      font-size: 10px;
      color: #1a4bb8;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <div class="field header-left">Документи</div>
  <div class="field header-right">Акаунт</div>

  <!-- Заголовок карточки -->
  <div class="field card-title">Транспортний квиток</div>

  <!-- Основные поля -->
  <div class="field label-ticket">Номер квитка:</div>
  <div class="field value-ticket ticket-number"></div>

  <div class="field label-price">Вартість:</div>
  <div class="field value-price price"></div>

  <div class="field label-date">Дата придбання:</div>
  <div class="field value-date date"></div>

  <div class="field label-board">Бортовий номер:</div>
  <div class="field value-board board-number"></div>

  <div class="field label-code">Код:</div>
  <div class="field value-code code"></div>

  <!-- Таймер -->
  <div class="field timer-label">ДІЙСНИЙ ЩЕ:</div>
  <div class="field timer-value timer"></div>

  <!-- Нижние подписи -->
  <div class="field nav-home">Головна</div>
  <div class="field nav-services">Сервіси</div>
  <div class="field nav-docs">Документи</div>

</body>
</html>
