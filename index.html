<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f7fa">
  <title>Транспортний квиток</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #f0f2f5;
    }

    body {
      background-image: url('background.jpg');
      background-size: 100% auto;
      background-position: center top;
      background-repeat: no-repeat;
      position: relative;
    }

    /* =========================================
       ЗДЕСЬ МЕНЯЙ ДАННЫЕ
    ========================================= */
    :root {
      --ticket-number: "AAF142608";
      --price: "10";
      --date: "14.10.2026 12.09";
      --board-number: "3008";
      --code: "TR02425";
    }

    .ticket-number::after { content: var(--ticket-number); }
    .price::after { content: var(--price); }
    .date::after { content: var(--date); }
    .board-number::after { content: var(--board-number); }
    .code::after { content: var(--code); }

    .field {
      position: absolute;
      color: #1c1c1e;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: -0.2px;
      white-space: nowrap;
    }

    /* =========================================
       ЗДЕСЬ ДВИГАЙ ВСЕ ТЕКСТЫ
    ========================================= */

    /* Шапка */
    .header-left {
      top: 5.5%;
      left: 5.3%;
      font-size: 17px;
      font-weight: 600;
      color: #29517e;
    }
    .header-right {
      top: 5.8%;
      right: 14%;
      font-size: 15px;
      font-weight: 500;
      color: #29517e;
    }

    /* Заголовок */
    .card-title {
      top: 14.8%;
      left: 22%;
      font-size: 17px;
      font-weight: 500;
      color: #1c1c1e;
    }

    /* Номер квитка */
    .label-ticket {
      top: 22%;
      left: 12.8%;
      color: #8e8e93;
      font-size: 13px;
    }
    .value-ticket {
      top: 22%;
      left: 42%;
      font-size: 15px;
      font-weight: 500;
      color: #2c2c2e;
    }

    /* Вартість */
    .label-price {
      top: 25.5%;
      left: 12.8%;
      color: #8e8e93;
      font-size: 13px;
    }
    .value-price {
      top: 25.5%;
      left: 42%;
      font-size: 15px;
      font-weight: 500;
      color: #2c2c2e;
    }

    /* Дата */
    .label-date {
      top: 28.8%;
      left: 12.8%;
      color: #8e8e93;
      font-size: 13px;
    }
    .value-date {
      top: 28.8%;
      left: 42%;
      font-size: 15px;
      font-weight: 500;
      color: #2c2c2e;
    }

    /* Бортовий номер */
    .label-board {
      top: 36.5%;
      left: 12.8%;
      color: #8e8e93;
      font-size: 13px;
    }
    .value-board {
      top: 36.5%;
      left: 42%;
      font-size: 15px;
      font-weight: 500;
      color: #2c2c2e;
    }

    /* Код */
    .label-code {
      top: 40.5%;
      left: 12.8%;
      color: #8e8e93;
      font-size: 13px;
    }
    .value-code {
      top: 40.5%;
      left: 42%;
      font-size: 15px;
      font-weight: 500;
      color: #2c2c2e;
    }

    /* ===== ТАЙМЕР ===== */
    /* Надпись "ДІЙСНИЙ ЩЕ" */
    .timer-label {
      top: 50%;
      left: 0;
      width: 100%;
      text-align: center;
      color: #6c6c70;
      font-size: 13px;
      font-weight: 500;
    }

    /* Сами цифры таймера — двигай отдельно */
    .timer-value {
      top: 53.8%;          /* <-- вот здесь двигай цифры */
      left: 0;
      width: 100%;
      text-align: center;
      color: #29517e;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: 0.3px;
      z-index: 5;
    }

    /* Невидимая кнопка сброса таймера */
    .timer-button {
      position: absolute;
      top: 52%;
      left: 20%;
      width: 60%;
      height: 10%;
      background: transparent;
      border: none;
      z-index: 10;
    }

    /* ===== НИЖНИЕ ПОДПИСИ ===== */
    /* Здесь меняй размер через font-size */
    .nav-home {
      bottom: 3%;
      left: 18%;
      font-size: 14px;        /* размер */
      color: #1c1c1e;
      font-weight: 500;
    }
    .nav-services {
      bottom: 2%;
      left: 42.7%;
      font-size: 16px;        /* размер */
      color: #1c1c1e;
      font-weight: 500;
    }
    .nav-docs {
      bottom: 3%;
      left: 69%;
      font-size: 14px;        /* размер */
      color: #29417e;
      font-weight: 500;
    }

    /* Невидимая кнопка на нижнем "Документи" */
    .docs-button {
      position: absolute;
      bottom: 1.5%;
      left: 65%;
      width: 25%;
      height: 6%;
      background: transparent;
      border: none;
      z-index: 20;
    }

    /* ===== МЕНЮ РЕДАКТИРОВАНИЯ ===== */
    .edit-menu {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.45);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .edit-menu.active {
      display: flex;
    }

    .edit-box {
      background: white;
      width: 85%;
      max-width: 340px;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .edit-box h3 {
      font-size: 17px;
      margin-bottom: 16px;
      text-align: center;
      color: #1c1c1e;
    }

    .edit-box label {
      display: block;
      font-size: 13px;
      color: #666;
      margin: 10px 0 4px;
    }

    .edit-box input {
      width: 100%;
      padding: 10px 12px;
      font-size: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
    }

    .edit-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .edit-buttons button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
    }

    .btn-save {
      background: #1a4bb8;
      color: white;
    }

    .btn-cancel {
      background: #eee;
      color: #333;
    }
  </style>
</head>
<body>

  <!-- Шапка -->
  <div class="field header-left">Документи</div>
  <div class="field header-right">Акаунт</div>

  <!-- Заголовок -->
  <div class="field card-title">Транспортний квиток</div>

  <!-- Поля -->
  <div class="field label-ticket">Номер квитка:</div>
  <div class="field value-ticket ticket-number"></div>

  <div class="field label-price">Вартість:</div>
  <div class="field value-price price"></div>

  <div class="field label-date">Дата придбання:</div>
  <div class="field value-date date"></div>

  <div class="field label-board">Бортовий номер:</div>
  <div class="field value-board board-number"></div>

  <div class="field label-code">Код:</div>
  <div class="field value-code code"></div>

  <!-- Таймер -->
  <div class="field timer-label">ДІЙСНИЙ ЩЕ:</div>
  <div class="field timer-value" id="timer">00:59:45</div>
  <button class="timer-button" onclick="resetTimer()"></button>

  <!-- Нижние подписи -->
  <div class="field nav-home">Головна</div>
  <div class="field nav-services">Сервіси</div>
  <div class="field nav-docs">Документи</div>

  <!-- Невидимая кнопка на Документи -->
  <button class="docs-button" onclick="openEditMenu()"></button>

  <!-- Меню редактирования -->
  <div class="edit-menu" id="editMenu">
    <div class="edit-box">
      <h3>Редагувати дані</h3>

      <label>Номер квитка</label>
      <input type="text" id="input-ticket" placeholder="AAF142608">

      <label>Дата придбання</label>
      <input type="text" id="input-date" placeholder="14.10.2026 12.09">

      <label>Бортовий номер</label>
      <input type="text" id="input-board" placeholder="3008">

      <label>Код</label>
      <input type="text" id="input-code" placeholder="TR02425">

      <div class="edit-buttons">
        <button class="btn-cancel" onclick="closeEditMenu()">Скасувати</button>
        <button class="btn-save" onclick="saveData()">Зберегти</button>
      </div>
    </div>
  </div>

  <script>
    let totalSeconds = 59 * 60 + 45;
    let timerInterval = null;

    function updateTimerDisplay() {
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      const display = 
        String(hours).padStart(2, '0') + ':' +
        String(minutes).padStart(2, '0') + ':' +
        String(seconds).padStart(2, '0');

      document.getElementById('timer').textContent = display;
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (totalSeconds <= 0) {
          clearInterval(timerInterval);
          return;
        }
        totalSeconds--;
        updateTimerDisplay();
      }, 1000);
    }

    function resetTimer() {
      totalSeconds = 59 * 60 + 59;
      updateTimerDisplay();
      startTimer();
    }

    // ===== Меню редактирования =====
    function openEditMenu() {
      // Подставляем текущие значения
      document.getElementById('input-ticket').value = getComputedStyle(document.documentElement).getPropertyValue('--ticket-number').replace(/"/g, '').trim();
      document.getElementById('input-date').value = getComputedStyle(document.documentElement).getPropertyValue('--date').replace(/"/g, '').trim();
      document.getElementById('input-board').value = getComputedStyle(document.documentElement).getPropertyValue('--board-number').replace(/"/g, '').trim();
      document.getElementById('input-code').value = getComputedStyle(document.documentElement).getPropertyValue('--code').replace(/"/g, '').trim();

      document.getElementById('editMenu').classList.add('active');
    }

    function closeEditMenu() {
      document.getElementById('editMenu').classList.remove('active');
    }

    function saveData() {
      const ticket = document.getElementById('input-ticket').value.trim();
      const date = document.getElementById('input-date').value.trim();
      const board = document.getElementById('input-board').value.trim();
      const code = document.getElementById('input-code').value.trim();

      document.documentElement.style.setProperty('--ticket-number', `"${ticket}"`);
      document.documentElement.style.setProperty('--date', `"${date}"`);
      document.documentElement.style.setProperty('--board-number', `"${board}"`);
      document.documentElement.style.setProperty('--code', `"${code}"`);

      closeEditMenu();
    }

    // Запуск
    updateTimerDisplay();
    startTimer();
  </script>
</body>
</html>
