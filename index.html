<style>
  body {
    background-image: url('background.jpg'); /* сюда точное имя файла, как ты его назвал */
    background-size: cover;           /* чтобы на весь экран тянулась */
    background-position: center;      /* по центру */
    background-repeat: no-repeat;     /* чтобы не повторялась как ебаный коврик */
    background-attachment: fixed;     /* если хочешь, чтобы не скроллилась */
    min-height: 100vh;                /* чтобы на всю высоту экрана было */
    margin: 0;
  }
</style>

function goFullscreen() {
  const elem = document.documentElement;
  if (elem.requestFullscreen) {
    elem.requestFullscreen();
  } else if (elem.webkitRequestFullscreen) { // Safari
    elem.webkitRequestFullscreen();
  }
}
